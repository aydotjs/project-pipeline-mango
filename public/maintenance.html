<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeDynasty – Under Maintenance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green-deep:   #047857;
      --green-mid:    #059669;
      --green-light:  #10b981;
      --green-glow:   #34d399;
      --bg:           #0a0e14;
      --bg2:          #111827;
      --card:         #1a202c;
      --text:         #f0fdf4;
      --muted:        #6ee7b7;
      --border:       rgba(16,185,129,0.18);
      --grad: linear-gradient(135deg, #047857 0%, #10b981 55%, #34d399 100%);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── animated grid background ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(16,185,129,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16,185,129,.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }
    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    /* ── glow orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width:500px; height:500px; background:#047857; top:-150px; left:-150px; animation-delay:0s; }
    .orb-2 { width:400px; height:400px; background:#10b981; bottom:-100px; right:-100px; animation-delay:-5s; }
    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* ── main card ── */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(26,32,44,0.85);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 4rem 3.5rem;
      max-width: 620px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 0 80px rgba(16,185,129,0.1), 0 30px 60px rgba(0,0,0,0.4);
      animation: cardIn 0.9s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(40px) scale(0.96); }
      to   { opacity:1; transform: translateY(0)    scale(1);    }
    }

    /* ── logo ── */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2.5rem;
      animation: fadeUp .7s .1s both;
    }
    .logo i {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.8rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

    /* ── gear icon ── */
    .gear-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 2rem;
      animation: fadeUp .7s .2s both;
    }
    .gear-wrap .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      background: var(--grad) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin 6s linear infinite;
    }
    .gear-wrap i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── heading ── */
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1rem;
      animation: fadeUp .7s .3s both;
    }
    h1 span {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p.subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      animation: fadeUp .7s .4s both;
    }

    /* ── status bar ── */
    .status-bar {
      background: rgba(4,120,87,0.12);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      color: var(--green-glow);
      animation: fadeUp .7s .5s both;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green-light);
      flex-shrink: 0;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── progress bar ── */
    .progress-wrap {
      background: rgba(255,255,255,0.05);
      border-radius: 50px;
      height: 8px;
      margin-bottom: 2.5rem;
      overflow: hidden;
      animation: fadeUp .7s .55s both;
    }
    .progress-fill {
      height: 100%;
      background: var(--grad);
      border-radius: 50px;
      width: 68%;
      animation: fillBar 2s 1s cubic-bezier(.4,0,.2,1) both;
      box-shadow: 0 0 16px rgba(52,211,153,0.5);
    }
    @keyframes fillBar { from { width:0% } to { width:68% } }
    .progress-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      margin-top: -1.8rem;
      margin-bottom: 2rem;
      padding-right: 2px;
      animation: fadeUp .7s .6s both;
    }

    /* ── social links ── */
    .socials {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      animation: fadeUp .7s .65s both;
    }
    .socials a {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-size: 1.1rem;
      text-decoration: none;
      transition: all .3s;
      background: rgba(16,185,129,0.05);
    }
    .socials a:hover {
      background: var(--grad);
      color: #fff;
      border-color: transparent;
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(16,185,129,0.3);
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0);    }
    }

    @media(max-width:500px) {
      .card { padding: 3rem 1.8rem; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">

    <div class="logo">
      <i class="fas fa-crown"></i>
      CodeDynasty
    </div>

    <div class="gear-wrap">
      <div class="ring"></div>
      <i class="fas fa-cog"></i>
    </div>

    <h1>We're <span>Upgrading</span><br/>the Dynasty</h1>

    <p class="subtitle">
      Our engineers are working hard to bring you<br/>
      something even better. Back very soon.
    </p>

    <div class="status-bar">
      <div class="dot"></div>
      <span>System upgrade in progress — estimated completion soon</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-fill"></div>
    </div>
    <p class="progress-label">68% complete</p>

    <div class="socials">
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>

  </div>

</body>
</html>
